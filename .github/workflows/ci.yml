name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - name: Build summary
        run: |
          echo "### rblez-ui v$(node -p "require('./package.json').version") · ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          du -sh apps/preview/dist >> "$GITHUB_STEP_SUMMARY"
  patch:
    name: Patch snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout rblez/patch
        uses: actions/checkout@v4
        with:
          repository: rblez/patch
          path: .patch-cli
      - uses: oven-sh/setup-bun@v2
      - name: Link patch CLI
        working-directory: .patch-cli
        run: |
          bun install
          bun link
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: patch test design/*/
        run: |
          fail=0
          for f in design/*/*.pat; do
            echo "::group::$f"
            patch test "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
